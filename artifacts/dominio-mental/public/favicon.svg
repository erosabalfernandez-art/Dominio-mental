<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#0A0A0A"/>
  <!-- Gold border frame -->
  <rect x="3" y="3" width="58" height="58" fill="none" stroke="#C9A84C" stroke-width="2.5"/>
  <!-- Corner accents -->
  <line x1="3" y1="3" x2="11" y2="3" stroke="#C9A84C" stroke-width="2.5"/>
  <line x1="3" y1="3" x2="3" y2="11" stroke="#C9A84C" stroke-width="2.5"/>
  <line x1="61" y1="3" x2="53" y2="3" stroke="#C9A84C" stroke-width="2.5"/>
  <line x1="61" y1="3" x2="61" y2="11" stroke="#C9A84C" stroke-width="2.5"/>
  <line x1="3" y1="61" x2="11" y2="61" stroke="#C9A84C" stroke-width="2.5"/>
  <line x1="3" y1="61" x2="3" y2="53" stroke="#C9A84C" stroke-width="2.5"/>
  <line x1="61" y1="61" x2="53" y2="61" stroke="#C9A84C" stroke-width="2.5"/>
  <line x1="61" y1="61" x2="61" y2="53" stroke="#C9A84C" stroke-width="2.5"/>
  <!-- DM letters in gold -->
  <text x="32" y="42" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="26" fill="#C9A84C" letter-spacing="1">DM</text>
  <!-- Thin gold line under text -->
  <line x1="16" y1="46" x2="48" y2="46" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>
</svg>
